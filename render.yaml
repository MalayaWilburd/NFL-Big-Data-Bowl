services:
  - type: web
    name: nfl-player-win-impact
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python src/compute_epa.py
    startCommand: gunicorn "src.dashboard:server" --bind 0.0.0.0:$PORT --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.7"
